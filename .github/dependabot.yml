# Dependabot version updates. Every label used below must exist in the repo:
# Dependabot doesn't create them, and silently leaves them off the PR.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
---

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # The Template pins claude-code-action to the version claude-review.yml's
    # sandbox notes were checked against. It moves only through the Template,
    # once they're checked again (mpaulosky/dotfiles#228).
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-actions:
        patterns:
          - "*"

  # Maintain dependencies for nuget
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "nuget"
      - "dependencies"
    groups:
      all-nuget:
        patterns:
          - "*"

  # Maintain DotNet Sdk
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "dotnet-sdk"
      - "dependencies"
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  # Maintain the pnpm workspace (root dev tooling: sandcastle, markdownlint;
  # and src/UI's Tailwind CLI). directory "/" covers every workspace package.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    labels:
      - "npm"
      - "dependencies"
    groups:
      all-npm:
        patterns:
          - "*"
